# Variante A: eigener Hostname (empfohlen)
server {
    listen 443 ssl http2;
    server_name zahlungen.example.ch;

    ssl_certificate     /etc/ssl/certs/zahlungen.example.ch.pem;
    ssl_certificate_key /etc/ssl/private/zahlungen.example.ch.key;

    # Nur internes Netz / VPN zulassen (anpassen)
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

